<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Chat</title>
</head>
<body>
  <h1>WebSocket Chat</h1>
  <div id="status">connecting…</div>
  <input type="text" id="name" placeholder="Name" size="8" />
  <input type="text" id="textbox" placeholder="Type a message" />
  <button id="send">Send</button>
  <ul id="messages"></ul>

  <script>
    const statusEl = document.getElementById("status");
    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("textbox");
    const sendButton = document.getElementById("send");
    const messagesEl = document.getElementById("messages");

    nameInput.value = "user" + Math.floor(Math.random() * 100);

    const ws = new WebSocket("ws://localhost:8080");

    ws.addEventListener("open", () => {
      statusEl.textContent = "connected";
    });

    ws.addEventListener("close", () => {
      statusEl.textContent = "disconnected";
    });

    ws.addEventListener("error", () => {
      statusEl.textContent = "error";
    });

    ws.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "chat") {
        const li = document.createElement("li");
        li.textContent = `[${msg.time}] ${msg.name}: ${msg.text}`;
        messagesEl.appendChild(li);
      }

      if (msg.type === "count") {
        statusEl.textContent = `connected, ${msg.count} online`;
      }
    });

    function sendMessage() {
      const text = textInput.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "chat", name: nameInput.value, text }));
      textInput.value = "";
    }

    sendButton.addEventListener("click", sendMessage);

    textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
